services:
  postgres:
    image: postgres:17-alpine
    container_name: apd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apd
      POSTGRES_PASSWORD: apd_local_dev
      POSTGRES_DB: apd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apd -d apd"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

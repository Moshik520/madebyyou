name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      # The Prisma client is generated code and is not committed, so it has to
      # be produced before anything type-checks. No database is contacted here.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # Type-aware lint rules read the Prisma types, so this runs after generate.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest

    # GitHub runs this container alongside the job, the way docker compose
    # does locally.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apd
          POSTGRES_PASSWORD: apd_local_dev
          POSTGRES_DB: apd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apd -d apd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://apd:apd_local_dev@localhost:5432/apd
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-32
      IMAGE_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api

      - name: Prepare the database
        run: npx prisma migrate deploy && npx prisma db seed
        working-directory: apps/api

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install browsers
        run: npx playwright install --with-deps
        working-directory: apps/web

      - name: Run end-to-end tests
        run: npx playwright test
        working-directory: apps/web

      # Keep the report even when the run fails, which is exactly when it matters.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

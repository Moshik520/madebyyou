# Port 80 does two jobs: it keeps serving the ACME challenge so renewals work,
# and it sends everything else to HTTPS.
server {
  listen 80;
  server_name madebyyou.duckdns.org;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name madebyyou.duckdns.org;

  ssl_certificate     /etc/letsencrypt/live/madebyyou.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/madebyyou.duckdns.org/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  # The API, and the images it serves from disk. Same origin in the browser,
  # so the relative URLs the API returns keep working.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
  }

  location /static/ {
    proxy_pass http://api:3000;
  }

  location /assets/ {
    proxy_pass http://api:3000;
  }

  # Hashed filenames never change contents, so they can be cached hard.
  location /bundle/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Anything else is a client-side route, not a file.
  location / {
    try_files $uri /index.html;
  }
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The API, and the images it serves from disk. Same origin in the browser,
  # so the relative URLs the API returns keep working.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
  }

  location /static/ {
    proxy_pass http://api:3000;
  }

  location /assets/ {
    proxy_pass http://api:3000;
  }

  # Hashed filenames never change contents, so they can be cached hard.
  location /bundle/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Anything else is a client-side route, not a file.
  location / {
    try_files $uri /index.html;
  }
}

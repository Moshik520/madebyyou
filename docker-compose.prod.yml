services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once and exits. Built from the build stage, which still has tsx and
  # the Prisma CLI that the seed script needs.
  migrate:
    build:
      context: ./apps/api
      target: build
    env_file: .env.prod
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - api-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx only reads the certificates; certbot writes them through its own
      # mount below.
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - api
    # nginx caches certificates at startup, so it has to be told to reload
    # after a renewal. Cheaper than watching the filesystem.
    command: >-
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done
      & nginx -g 'daemon off;'"

  # Wakes up twice a day. certbot renews only inside the last 30 days of the
  # certificate's life, so this is almost always a no-op.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot;
      sleep 12h & wait $${!}; done"

volumes:
  postgres-data:
  api-storage:
  certbot-certs:
  certbot-webroot:
